<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LightThreads - Terminal Private Session</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #console-container {
            width: 100%;
            max-width: 760px;
            height: 85vh;
            border: 1px solid #00ff66;
            background: #050505;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
        }

        #header {
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 0.85em;
        }

        #status {
            color: #ffcc00;
            margin-top: 4px;
        }

        #session-controls {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #terminal-log {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-entry {
            word-break: break-all;
            line-height: 1.4;
        }

        .sys-msg {
            color: #0088ff;
        }

        .user-msg {
            color: #00ff66;
        }

        .err-msg {
            color: #ff3333;
        }

        .warn-msg {
            color: #ffcc00;
        }

        .input-row {
            display: flex;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 10px;
        }

        .prompt-symbol {
            color: #00ff66;
            margin-right: 8px;
            font-weight: bold;
        }

        input {
            background: transparent;
            border: 1px solid #333;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            padding: 4px 8px;
            outline: none;
        }

        #usernameInput {
            width: 140px;
        }

        #messageInput {
            flex: 1;
            border: none;
        }

        input:disabled {
            color: #444444;
            border-color: #222;
        }

        button {
            background: transparent;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 4px 12px;
            cursor: pointer;
        }

            button:hover:not(:disabled) {
                background: #00ff66;
                color: #000;
            }

            button:disabled {
                border-color: #444;
                color: #444;
                cursor: not-allowed;
            }

        .action-btn {
            margin-left: 8px;
            padding: 2px 8px;
            font-size: 0.8em;
        }

        .approve-btn {
            border-color: #00ff66;
            color: #00ff66;
        }

        .deny-btn {
            border-color: #ff3333;
            color: #ff3333;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="/encryption.js"></script>
</head>
<body>
    <div id="console-container">
        <div id="header">
            <div>LIGHTTHREADS [Version 2.0.0-PRODUCTION-READY]</div>
            <div id="status">[SYSTEM] Initializing core engine...</div>
        </div>

        <div id="session-controls">
            <input type="text" id="usernameInput" placeholder="Your Name" maxlength="15" autocomplete="off" />
            <button id="createSessionBtn">Create Session</button>
            <span id="sessionInfo" style="font-size:0.85em; color:#aaa;"></span>
        </div>

        <div id="terminal-log"></div>

        <div class="input-row">
            <span class="prompt-symbol" id="promptDisplay">&gt;</span>
            <input type="text" id="messageInput" placeholder="Type message..." disabled autocomplete="off" />
            <button id="sendBtn" disabled>SEND</button>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById("status");
        const msgInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const terminalLog = document.getElementById("terminal-log");
        const createSessionBtn = document.getElementById("createSessionBtn");
        const sessionInfo = document.getElementById("sessionInfo");
        const usernameInput = document.getElementById("usernameInput");
        const promptDisplay = document.getElementById("promptDisplay");

        let currentSessionId = "";
        let currentUsername = "";
        let activePin = "";
        const MAX_LOG_ITEMS = 50; // Purge old DOM logs to protect RAM memory

        const pathSegments = window.location.pathname.split('/').filter(p => p.length > 0);
        const urlPin = pathSegments.length > 0 && pathSegments[0].length === 6 ? pathSegments[0] : null;

        function getHandle() {
            const entered = usernameInput.value.trim();
            if (entered) return entered;
            return urlPin ? "Guest" : "Host";
        }

        function appendLog(text, className = "user-msg") {
            const line = document.createElement("div");
            line.className = `log-entry ${className}`;
            line.innerHTML = text;
            terminalLog.appendChild(line);

            while (terminalLog.children.length > MAX_LOG_ITEMS) {
                terminalLog.removeChild(terminalLog.firstChild);
            }

            terminalLog.scrollTop = terminalLog.scrollHeight;
            return line;
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/chat")
            .withAutomaticReconnect()
            .build();

        connection.on("ReceiveMessage", async (user, encryptedMessage) => {
            if (user === "SYSTEM") {
                appendLog(`[SYSTEM] ${escapeHtml(encryptedMessage)}`, "sys-msg");
            } else {
                const plaintext = await LightEncryption.decryptMessage(encryptedMessage, activePin);
                appendLog(`[${escapeHtml(user)}] ${escapeHtml(plaintext)}`, "user-msg");
            }
        });

        connection.on("SystemError", (err) => {
            appendLog(`[ERROR] ${escapeHtml(err)}`, "err-msg");
        });

        connection.on("PendingApprovalRequest", (guestConnectionId, guestName, pin) => {
            const logItem = appendLog(`[KNOCK] User "${escapeHtml(guestName)}" trying to join with URL /${pin}. `, "warn-msg");

            const acceptBtn = document.createElement("button");
            acceptBtn.className = "action-btn approve-btn";
            acceptBtn.innerText = "ACCEPT";

            const denyBtn = document.createElement("button");
            denyBtn.className = "action-btn deny-btn";
            denyBtn.innerText = "DENY";

            acceptBtn.onclick = () => {
                connection.invoke("RespondToKnock", guestConnectionId, true);
                logItem.innerHTML = `[ACCEPTED] User "${escapeHtml(guestName)}" admitted to chat.`;
            };

            denyBtn.onclick = () => {
                connection.invoke("RespondToKnock", guestConnectionId, false);
                logItem.innerHTML = `[DENIED] User "${escapeHtml(guestName)}" rejected. URL shifted!`;
            };

            logItem.appendChild(acceptBtn);
            logItem.appendChild(denyBtn);
        });

        connection.on("ShiftUrlToNewPin", (newPin) => {
            activePin = newPin;
            const newRelativePath = `/${newPin}`;
            const fullNewUrl = `${window.location.origin}${newRelativePath}`;

            window.history.replaceState({}, "", newRelativePath);

            sessionInfo.innerText = `Active URL: ${newRelativePath}`;
            appendLog(`[URL SHIFTED] Old URL invalidated.`, "warn-msg");
            appendLog(`[NEW SHARE URL] ${fullNewUrl}`, "sys-msg");
        });

        connection.on("JoinApproved", (sessionId, pin) => {
            currentSessionId = sessionId;
            activePin = pin;
            window.history.replaceState({}, "", `/${pin}`);

            statusDiv.innerText = `[CONNECTED - E2E ACTIVE] Room: ${sessionId} as ${currentUsername}`;
            statusDiv.style.color = "#00ff66";
            msgInput.disabled = false;
            sendBtn.disabled = false;
            usernameInput.disabled = true;
            promptDisplay.innerText = `${currentUsername} >`;
            msgInput.focus();
        });

        connection.on("JoinDenied", () => {
            statusDiv.innerText = "[DENIED] Access denied by host.";
            statusDiv.style.color = "#ff3333";
            appendLog("[SYSTEM] Join request rejected. The URL you used is no longer valid.", "err-msg");
        });

        connection.start()
            .then(() => {
                statusDiv.innerText = "[SYSTEM] SignalR Active.";
                statusDiv.style.color = "#00ff66";

                if (urlPin) {
                    createSessionBtn.innerText = "Knock to Join";
                    createSessionBtn.onclick = () => {
                        currentUsername = getHandle();
                        statusDiv.innerText = `[SYSTEM] Knocking on /${urlPin} as "${currentUsername}"... Waiting for host.`;
                        statusDiv.style.color = "#ffcc00";
                        createSessionBtn.disabled = true;
                        usernameInput.disabled = true;
                        connection.invoke("KnockWithPin", urlPin, currentUsername);
                    };
                }
            })
            .catch(err => {
                console.error(err);
                statusDiv.innerText = "[ERROR] Connection failed.";
                statusDiv.style.color = "#ff3333";
            });

        createSessionBtn.addEventListener("click", async () => {
            if (urlPin) return;

            try {
                currentUsername = getHandle();
                const res = await fetch("/api/session/create", { method: "POST" });
                const data = await res.json();

                currentSessionId = data.sessionId;
                activePin = data.pin;

                const relativePath = `/${data.pin}`;
                const shareUrl = `${window.location.origin}${relativePath}`;

                window.history.replaceState({}, "", relativePath);
                sessionInfo.innerText = `Active URL: ${relativePath}`;

                appendLog(`[SYSTEM] Session Created!`, "sys-msg");
                appendLog(`[SHARE URL] ${shareUrl}`, "sys-msg");

                connection.invoke("RegisterHostSession", currentSessionId)
                    .then(() => {
                        statusDiv.innerText = `[HOSTING as ${currentUsername}] Listening on ${relativePath}`;
                        createSessionBtn.disabled = true;
                        usernameInput.disabled = true;
                        msgInput.disabled = false;
                        sendBtn.disabled = false;
                        promptDisplay.innerText = `${currentUsername} >`;
                    });
            } catch (err) {
                appendLog(`[ERROR] Failed to create session.`, "err-msg");
            }
        });

        async function sendMessage() {
            const msg = msgInput.value.trim();
            if (msg && currentSessionId && activePin) {
                const encryptedPayload = await LightEncryption.encryptMessage(msg, activePin);
                connection.invoke("SendGroupMessage", currentSessionId, currentUsername, encryptedPayload)
                    .catch(err => console.error(err));
                msgInput.value = "";
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
